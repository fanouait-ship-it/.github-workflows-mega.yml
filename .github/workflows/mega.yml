name: Download to MEGA

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien direct, lien .torrent ou magnet"
        required: true
      mega_folder:
        description: "Dossier de destination sur MEGA"
        required: true
        default: "Videos"
      max_gb:
        description: "Taille max par partie (Go)"
        required: true
        default: "10"

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 megatools

      - name: Configurer MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          printf "[Login]\nUsername = %s\nPassword = %s\n" "$MEGA_EMAIL" "$MEGA_PASSWORD" > ~/.megarc
          chmod 600 ~/.megarc

      - name: Télécharger
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads
          aria2c --dir=downloads \
            --seed-time=0 \
            --file-allocation=none \
            --max-connection-per-server=16 --split=16 \
            --bt-stop-timeout=600 \
            --summary-interval=30 \
            "$URL"
          df -h .

      - name: Découper en parties et envoyer sur MEGA
        env:
          MEGA_FOLDER: ${{ inputs.mega_folder }}
          MAX_GB: ${{ inputs.max_gb }}
        run: |
          cat > upload.py << 'PYEOF'
          import os
          import subprocess
          import sys

          root = "downloads"
          dest = "/Root/" + os.environ["MEGA_FOLDER"].strip("/")
          max_bytes = float(os.environ.get("MAX_GB", "10")) * 1024**3

          files = []
          for d, _, names in os.walk(root):
              for n in names:
                  if n.endswith(".aria2"):
                      continue
                  p = os.path.join(d, n)
                  files.append((p, os.path.getsize(p)))
          files.sort()

          if not files:
              sys.exit("Aucun fichier téléchargé.")

          # Regroupement : un fichier n'est jamais découpé
          batches, current, size = [], [], 0
          for p, s in files:
              if s > max_bytes:
                  print(f"Attention: {p} fait {s/1024**3:.1f} Go (> limite), envoyé seul sans découpe.")
              if current and size + s > max_bytes:
                  batches.append(current)
                  current, size = [], 0
              current.append((p, s))
              size += s
          if current:
              batches.append(current)

          multi = len(batches) > 1
          print(f"{len(files)} fichier(s) -> {len(batches)} partie(s)")

          for i, batch in enumerate(batches, 1):
              target = f"{dest}/part{i}" if multi else dest
              print(f"\n=== Partie {i}/{len(batches)} -> {target} ===")
              subprocess.run(["megatools", "mkdir", target], check=False)
              for p, s in batch:
                  rel = os.path.dirname(os.path.relpath(p, root))
                  sub = f"{target}/{rel}" if rel else target
                  if rel:
                      subprocess.run(["megatools", "mkdir", sub], check=False)
                  subprocess.run(["megatools", "put", "--no-progress", "--path", sub, p], check=True)
                  os.remove(p)
                  print(f"OK {os.path.basename(p)} ({s/1024**3:.2f} Go)")
          print("\nTerminé.")
          PYEOF
          python3 upload.py