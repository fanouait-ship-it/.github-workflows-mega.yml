name: Torrent vers MEGA

on:
  workflow_dispatch:
    inputs:
      lien:
        description: "Magnet, URL .torrent ou lien direct"
        required: true
      fichiers:
        description: "Index des fichiers à prendre (ex: 1,3-5). Vide = tout"
        required: false

jobs:
  transfert:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Installer les outils
        run: sudo apt-get update && sudo apt-get install -y aria2 megatools

      - name: Télécharger
        env:
          LIEN: ${{ inputs.lien }}
          FICHIERS: ${{ inputs.fichiers }}
        run: |
          mkdir -p dl && cd dl
          OPT=""
          [ -n "$FICHIERS" ] && OPT="--select-file=$FICHIERS"
          aria2c --seed-time=0 --file-allocation=none \
            --bt-stop-timeout=600 -x16 -s16 $OPT "$LIEN"

      - name: Envoyer sur MEGA (racine)
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          cd dl
          find . -type f \( -iname "*.mkv" -o -iname "*.mp4" -o -iname "*.avi" \) -print0 |
          while IFS= read -r -d '' f; do
            for i in 1 2 3; do
              megatools put --no-progress --path /Root \
                -u "$MEGA_EMAIL" -p "$MEGA_PASSWORD" "$f" && break
              sleep 30
            done
            rm -f "$f"
          done