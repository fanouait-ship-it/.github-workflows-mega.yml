name: HLS vers MEGA
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien .m3u8"
        required: true
      nom:
        description: "Nom du fichier (sans extension)"
        required: true
        default: "video"
      referer:
        description: "Referer (optionnel, ex: https://site-d-origine.com/)"
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Installer ffmpeg et rclone
        run: sudo apt-get update && sudo apt-get install -y ffmpeg rclone

      - name: Télécharger la vidéo HLS
        env:
          URL: ${{ inputs.url }}
          NOM: ${{ inputs.nom }}
          REFERER: ${{ inputs.referer }}
        run: |
          if [ -n "$REFERER" ]; then
            ffmpeg -headers "Referer: $REFERER"$'\r\n' -i "$URL" \
              -c copy -bsf:a aac_adtstoasc "$NOM.mp4"
          else
            ffmpeg -i "$URL" -c copy -bsf:a aac_adtstoasc "$NOM.mp4"
          fi
          ls -lh "$NOM.mp4"

      - name: Envoyer sur MEGA
        env:
          MEGA_USER: ${{ secrets.MEGA_USER }}
          MEGA_PASS: ${{ secrets.MEGA_PASS }}
          NOM: ${{ inputs.nom }}
        run: |
          export RCLONE_CONFIG_MEGA_TYPE=mega
          export RCLONE_CONFIG_MEGA_USER="$MEGA_USER"
          export RCLONE_CONFIG_MEGA_PASS="$(rclone obscure "$MEGA_PASS")"
          rclone copyto "$NOM.mp4" "mega:Videos/$NOM.mp4" -P