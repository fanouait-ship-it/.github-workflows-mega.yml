name: HLS vers MEGA

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien .m3u8 complet"
        required: true
        default: "https://prx-1590-for.vmnow.online/hls2/03/02225/6reetez3nyh5_n/index-v1-a1.m3u8?t=mL5DejohkMJckx98szsaVNSa9V2gbV5kML7VxKKfdjM=&s=1791483556&e=43200&v=&srv=rck3&i=0.4&sp=0&asn=36947"
      nom:
        description: "Nom du fichier (sans extension)"
        required: true
        default: "video"
      referer:
        description: "Referer ou Origin (optionnel)"
        required: false
        default: "https://vmnow.online/"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Vérifier l'espace disque disponible
        run: df -h

      - name: Installer yt-dlp, ffmpeg et rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Télécharger la vidéo HLS avec yt-dlp
        env:
          URL: ${{ inputs.url }}
          NOM: ${{ inputs.nom }}
          REFERER: ${{ inputs.referer }}
        run: |
          echo "Téléchargement en cours avec yt-dlp..."
          
          EXTRA_ARGS=""
          if [ -n "$REFERER" ]; then
            EXTRA_ARGS="--referer $REFERER --add-header Origin:$(echo $REFERER | awk -F/ '{print $1"//"$3}')"
          fi

          yt-dlp "$URL" \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            $EXTRA_ARGS \
            -o "$NOM.mp4"

          if [ -f "$NOM.mp4" ] && [ -s "$NOM.mp4" ]; then
            ls -lh "$NOM.mp4"
          else
            echo "Erreur : Le fichier vidéo n'a pas pu être téléchargé."
            exit 1
          fi

      - name: Envoyer sur MEGA
        env:
          MEGA_USER: ${{ secrets.MEGA_USER }}
          MEGA_PASS: ${{ secrets.MEGA_PASS }}
          NOM: ${{ inputs.nom }}
        run: |
          echo "Configuration de Rclone pour MEGA..."
          export RCLONE_CONFIG_MEGA_TYPE=mega
          export RCLONE_CONFIG_MEGA_USER="$MEGA_USER"
          export RCLONE_CONFIG_MEGA_PASS="$(rclone obscure "$MEGA_PASS")"
          
          echo "Envoi du fichier vers MEGA..."
          rclone copyto "$NOM.mp4" "mega:Videos/$NOM.mp4" -P --stats-one-line
          
          echo "Téléversement terminé avec succès !"