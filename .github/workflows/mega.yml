name: Download to MEGA

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien direct, lien .torrent ou magnet"
        required: true
      mega_folder:
        description: "Dossier de destination sur MEGA"
        required: true
        default: "Videos"
      max_gb:
        description: "Taille max par partie (Go)"
        required: true
        default: "10"

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 megatools

      - name: Configurer MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          printf "[Login]\nUsername = %s\nPassword = %s\n" "$MEGA_EMAIL" "$MEGA_PASSWORD" > ~/.megarc
          chmod 600 ~/.megarc

      - name: Télécharger
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir -p downloads
          aria2c --dir=downloads \
            --seed-time=0 \
            --file-allocation=none \
            --max-connection-per-server=16 --split=16 \
            --bt-stop-timeout=600 \
            --summary-interval=30 \
            "$URL"
          df -h .

      - name: Découper en parties et envoyer sur MEGA
        env:
          MEGA_FOLDER: ${{ inputs.mega_folder }}
          MAX_GB: ${{ inputs.max_gb }}
        run: python3 scripts/upload_batches.py downloads