name: Torrent vers MEGA

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Lien magnet ou URL du .torrent"
        required: true

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 rclone

      - name: Télécharger le torrent
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          mkdir -p dl
          aria2c --dir=dl --seed-time=0 \
            --bt-stop-timeout=600 \
            --max-connection-per-server=4 \
            "$SOURCE"

      - name: Envoyer sur MEGA
        env:
          RCLONE_CONFIG_MEGA_TYPE: mega
          RCLONE_CONFIG_MEGA_USER: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          export RCLONE_CONFIG_MEGA_PASS="$(rclone obscure "$MEGA_PASSWORD")"
          rclone copy dl mega:Torrents --transfers 2 -v