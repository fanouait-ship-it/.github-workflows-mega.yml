name: Torrent to MEGA

on:
  workflow_dispatch:
    inputs:
      torrent:
        description: "Lien magnet ou URL d'un fichier .torrent"
        required: true
        type: string
      mega_dir:
        description: "Dossier de destination sur MEGA"
        required: false
        default: "/Torrents"
        type: string

jobs:
  torrent-to-mega:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # limite GitHub : 360 min max par job

    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Installer aria2 et MEGAcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          wget -q https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb
          sudo apt-get install -y ./megacmd-xUbuntu_24.04_amd64.deb

      - name: Télécharger le torrent
        env:
          TORRENT: ${{ inputs.torrent }}
        run: |
          mkdir -p downloads
          aria2c \
            --dir=downloads \
            --seed-time=0 \
            --file-allocation=none \
            --summary-interval=60 \
            --bt-stop-timeout=600 \
            "$TORRENT"
          rm -f downloads/*.aria2
          ls -lah downloads

      - name: Envoyer sur MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          MEGA_DIR: ${{ inputs.mega_dir }}
        run: |
          mega-login "$MEGA_EMAIL" "$MEGA_PASSWORD"
          mega-mkdir -p "$MEGA_DIR" || true
          for item in downloads/*; do
            echo "Upload : $item"
            mega-put -c "$item" "$MEGA_DIR/"
          done
          mega-transfers --only-uploads || true
          mega-logout