name: Torrent / Lien vers MEGA

on:
  workflow_dispatch:
    inputs:
      lien:
        description: "Magnet, .torrent, lien direct ou .m3u8"
        required: true
      fichiers:
        description: "Torrent seulement : index des fichiers (ex: 1,3-5). Vide = tout"
        required: false
      nom:
        description: "m3u8 seulement : nom du fichier (sans extension)"
        required: false
        default: "video"
      referer:
        description: "m3u8 seulement : Referer si le site l'exige (optionnel)"
        required: false

jobs:
  transfert:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Installer les outils
        run: sudo apt-get update && sudo apt-get install -y aria2 megatools ffmpeg

      - name: Télécharger
        env:
          LIEN: ${{ inputs.lien }}
          FICHIERS: ${{ inputs.fichiers }}
          NOM: ${{ inputs.nom }}
          REFERER: ${{ inputs.referer }}
        run: |
          mkdir -p dl && cd dl
          if [[ "$LIEN" == *".m3u8"* ]]; then
            HDR=""
            [ -n "$REFERER" ] && HDR="Referer: $REFERER"$'\r\n'
            ffmpeg -nostdin -loglevel warning -stats \
              -user_agent "Mozilla/5.0" -headers "$HDR" \
              -i "$LIEN" -c copy -bsf:a aac_adtstoasc "${NOM:-video}.mp4"
          else
            OPT=""
            [ -n "$FICHIERS" ] && OPT="--select-file=$FICHIERS"
            aria2c --seed-time=0 --file-allocation=none \
              --bt-stop-timeout=600 -x16 -s16 $OPT "$LIEN"
          fi
          ls -lh

      - name: Envoyer sur MEGA (racine)
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          cd dl
          find . -type f \( -iname "*.mkv" -o -iname "*.mp4" -o -iname "*.avi" \) -print0 |
          while IFS= read -r -d '' f; do
            for i in 1 2 3; do
              megatools put --no-progress --path /Root \
                -u "$MEGA_EMAIL" -p "$MEGA_PASSWORD" "$f" && break
              sleep 30
            done
            rm -f "$f"
          done